<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live Typing Display</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-white">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-5 py-12">
    <div class="mb-8 text-center">
      <div class="mb-3 text-5xl">⌨️</div>
      <h1 class="text-3xl font-bold">Live Typing Display</h1>
      <p class="mt-2 text-slate-600 dark:text-slate-400">Ketik di satu perangkat, tampil langsung di perangkat lain.</p>
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
      <a href="input.html" class="rounded-2xl bg-blue-600 p-7 text-white shadow-lg transition hover:bg-blue-700">
        <div class="text-3xl">✍️</div><h2 class="mt-4 text-xl font-bold">Mode Pengetik</h2>
        <p class="mt-2 text-sm text-blue-100">Buat atau masukkan Room ID, lalu mulai mengetik.</p>
      </a>
      <a href="display.html" class="rounded-2xl border border-slate-200 bg-white p-7 shadow-lg transition hover:border-blue-400 dark:border-slate-800 dark:bg-slate-900">
        <div class="text-3xl">🖥️</div><h2 class="mt-4 text-xl font-bold">Mode Tampilan</h2>
        <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Masukkan Room ID untuk melihat tulisan secara langsung.</p>
      </a>
    </div>
    <p class="mt-8 text-center text-xs text-slate-500">Memerlukan koneksi internet dan konfigurasi Firebase.</p>
  </main>
  <script type="module">
    const saved=localStorage.getItem('ltd-theme');
    if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
  </script>
</body></html>

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mode Tampilan — Live Typing</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'}</script>
</head>
<body class="min-h-screen bg-white text-slate-900 dark:bg-black dark:text-white">
  <main class="flex min-h-screen flex-col">
    <header id="toolbar" class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-4 py-3 dark:border-slate-800">
      <a href="index.html" class="text-sm text-blue-600 hover:underline">← Beranda</a>
      <div class="flex flex-wrap items-center gap-2">
        <input id="roomInput" inputmode="numeric" maxlength="6" placeholder="Room ID" class="w-36 rounded-lg border border-slate-300 bg-transparent px-3 py-2 font-mono tracking-widest dark:border-slate-700">
        <button id="connectBtn" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white">Tampilkan</button>
        <button id="themeBtn" class="rounded-lg border border-slate-300 px-3 py-2 text-sm dark:border-slate-700">🌙 / ☀️</button>
        <button id="fullBtn" class="rounded-lg border border-slate-300 px-3 py-2 text-sm dark:border-slate-700">⛶ Fullscreen</button>
      </div>
    </header>
    <div class="flex items-center justify-between px-5 py-2 text-xs text-slate-500">
      <span id="status">Belum terhubung</span><span id="roomLabel"></span>
    </div>
    <section class="flex flex-1 items-start justify-center px-5 py-8 sm:px-10 sm:py-12">
      <div id="displayText" class="w-full max-w-6xl whitespace-pre-wrap break-words text-center text-3xl font-semibold leading-relaxed sm:text-5xl lg:text-6xl">Tulisan dari laptop pengetik akan muncul di sini.</div>
    </section>
  </main>
  <script type="module" src="js/display.js"></script>
</body></html>
